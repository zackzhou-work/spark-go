<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 640px; overflow: hidden; }
  body {
    display: flex; align-items: center; justify-content: center; gap: 88px;
    background: radial-gradient(circle at 30% 20%, #3b414b 0%, #2a2e35 45%, #1c1f24 100%);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
    color: #f4f1eb;
    -webkit-font-smoothing: antialiased;
  }
  .app {
    width: 315px; height: 560px;
    border-radius: 13px;
    box-shadow: 0 30px 60px rgba(0, 0, 0, 0.45), 0 8px 18px rgba(0, 0, 0, 0.3);
  }
  .copy { width: 560px; }
  .brand { display: flex; align-items: center; gap: 20px; margin-bottom: 36px; }
  .brand img { width: 76px; height: 76px; border-radius: 18px; box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.1), 0 10px 24px rgba(0, 0, 0, 0.4); }
  .brand h1 { font-size: 72px; font-weight: 700; letter-spacing: -2px; }
  .tagline { font-size: 40px; font-weight: 600; line-height: 1.18; letter-spacing: -0.6px; margin-bottom: 22px; }
  .subtitle { font-size: 22px; line-height: 1.45; color: #b7bcc4; margin-bottom: 40px; }
  .meta { font-size: 16px; color: #8a909a; letter-spacing: 0.4px; }
</style>
</head>
<body>
  <img class="app" src="app.png" alt="">
  <div class="copy">
    <div class="brand"><img src="icon.png" alt=""><h1>spark</h1></div>
    <p class="tagline">Every Claude Desktop session, at a glance.</p>
    <p class="subtitle">One character per project: waiting on you, working, new to read or all caught up — always on top.</p>
    <p class="meta">macOS · Go · mygo</p>
  </div>
</body>
</html>
